# ==============================================================================
# VisaIndia.io / VisaSetu — Render Infrastructure Blueprint (render.yaml)
# ==============================================================================
# Deploy with one click on Render: https://dashboard.render.com/blueprints

services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service (Spring Boot 3 / Java 21)
  # ----------------------------------------------------------------------------
  - type: web
    name: visaindia-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Connect to Render Managed PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: visaindia-postgres
          property: connectionString

      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: visaindia-postgres
          property: connectionString

      # Cryptographic secrets auto-generated securely on first deployment
      - key: JWT_SECRET
        generateValue: true

      - key: PII_ENCRYPTION_KEY
        generateValue: true

      # Payment gateway credentials (configure via Render Dashboard)
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Allow cross-origin requests from Vercel deployments and local test suites
      - key: VISASETU_CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"

# ------------------------------------------------------------------------------
# Managed Database (PostgreSQL 16)
# ------------------------------------------------------------------------------
databases:
  - name: visaindia-postgres
    databaseName: visasetu_db
    user: visasetu_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
