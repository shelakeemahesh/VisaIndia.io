name: VisaSetu CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'chore/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Backend Tests
        run: |
          cd backend
          mvn clean test

  frontend-test:
    name: Frontend (Node 22 / Vite + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Build
        run: |
          cd frontend
          npm run build
