server:
  port: ${PORT:${APP_PORT:8080}}
  forward-headers-strategy: native

spring:
  application:
    name: visasetu-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visasetu_db}
    username: ${SPRING_DATASOURCE_USERNAME:visasetu_user}
    password: ${SPRING_DATASOURCE_PASSWORD:visasetu_secure_dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://visasetu_mongo:visasetu_mongo_dev_pass@localhost:27017/visasetu_forms?authSource=admin}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:visasetu_rabbit}
    password: ${SPRING_RABBITMQ_PASSWORD:visasetu_rabbit_dev_pass}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

visasetu:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  security:
    pii-encryption-key: ${PII_ENCRYPTION_KEY:}
    otp-pepper: ${OTP_PEPPER:visasetu-enterprise-otp-pepper-2026-super-secret}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${MINIO_BUCKET:visasetu-documents}

  mock:
    adjudication:
      enabled: ${MOCK_ADJUDICATION_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
  health:
    mongo:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
