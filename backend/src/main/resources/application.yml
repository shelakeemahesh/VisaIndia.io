server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: visasetu-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visasetu_db}
    username: ${SPRING_DATASOURCE_USERNAME:visasetu_user}
    password: ${SPRING_DATASOURCE_PASSWORD:visasetu_secure_dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://visasetu_mongo:visasetu_mongo_dev_pass@localhost:27017/visasetu_forms?authSource=admin}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:visasetu_rabbit}
    password: ${SPRING_RABBITMQ_PASSWORD:visasetu_rabbit_dev_pass}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

visasetu:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  security:
    pii-encryption-key: ${PII_ENCRYPTION_KEY:dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS0xMjM=}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_sample_key_12345}
    key-secret: ${RAZORPAY_KEY_SECRET:sample_razorpay_secret_67890}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:sample_webhook_secret_abcde}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${MINIO_BUCKET:visasetu-documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
